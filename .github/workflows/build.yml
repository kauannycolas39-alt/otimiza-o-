name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar projeto
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Otimizador"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.otimizador"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.otimizador"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:label="NitroCore"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path android:fillColor="#04070D" android:pathData="M24,0H84A24,24 0 0 1 108,24V84A24,24 0 0 1 84,108H24A24,24 0 0 1 0,84V24A24,24 0 0 1 24,0Z"/>
            <path android:strokeColor="#0099FF" android:strokeWidth="1.5" android:pathData="M24,2H84A22,22 0 0 1 106,24V84A22,22 0 0 1 84,106H24A22,22 0 0 1 2,84V24A22,22 0 0 1 24,2Z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M37,29h3v5h-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M37,74h3v5h-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M29,37v3h5v-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M74,37v3h5v-3z"/>
            <path android:strokeColor="#00A0FF" android:strokeWidth="1" android:pathData="M38.5,29V21"/>
            <path android:strokeColor="#00A0FF" android:strokeWidth="1" android:pathData="M38.5,79V87"/>
            <path android:strokeColor="#00A0FF" android:strokeWidth="1" android:pathData="M29,38.5H21"/>
            <path android:strokeColor="#00A0FF" android:strokeWidth="1" android:pathData="M79,38.5H87"/>
            <path android:fillColor="#BFC6D2" android:pathData="M44,29h3v5h-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M44,74h3v5h-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M29,44v3h5v-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M74,44v3h5v-3z"/>
            <path android:strokeColor="#39FF14" android:strokeWidth="1" android:pathData="M45.5,29V17"/>
            <path android:strokeColor="#39FF14" android:strokeWidth="1" android:pathData="M45.5,79V91"/>
            <path android:strokeColor="#39FF14" android:strokeWidth="1" android:pathData="M29,45.5H17"/>
            <path android:strokeColor="#39FF14" android:strokeWidth="1" android:pathData="M79,45.5H91"/>
            <path android:fillColor="#BFC6D2" android:pathData="M51,29h3v5h-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M51,74h3v5h-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M29,51v3h5v-3z"/>
            <path android:fillColor="#BFC6D2" android:pathData="M74,51v3h5v-3z"/>
            <path android:strokeColor="#00A0FF" android:strokeWidth="1" android:pathData="M52.5,29V13"/>
            <path android:strokeColor="#00A0FF" android:strokeWidth="1" android:pathData="M52.5,79V95"/>
            <path android:strokeColor="#00A0FF" android:strokeWidth="1" android:pathData="M29,52.5H13"/>
