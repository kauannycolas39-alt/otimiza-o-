          package com.otimizador

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(ctx: Context) { sp = ctx.getSharedPreferences("nitrocore", Context.MODE_PRIVATE) }

              fun now(): String = SimpleDateFormat("dd/MM/yyyy HH:mm", Locale("pt", "BR")).format(Date())

              var theme: Int
                  get() = sp.getInt("theme", 1)
                  set(v) { sp.edit().putInt("theme", v).apply() }

              var favFF: String
                  get() = sp.getString("fav_ff", "") ?: ""
                  set(v) { sp.edit().putString("fav_ff", v).apply() }

              var gamerAuto: Boolean
                  get() = sp.getBoolean("gamer_auto", false)
                  set(v) { sp.edit().putBoolean("gamer_auto", v).apply() }

              var aiConsent: Boolean
                  get() = sp.getBoolean("ai_consent", false)
                  set(v) { sp.edit().putBoolean("ai_consent", v).apply() }

              var backendUrl: String
                  get() = sp.getString("backend_url", "") ?: ""
                  set(v) { sp.edit().putString("backend_url", v).apply() }

              fun saveLastAi(json: String) {
                  sp.edit().putString("last_ai", json).putString("last_ai_date", now()).apply()
              }

              fun lastAi(): AiResult? {
                  val raw = sp.getString("last_ai", null) ?: return null
                  return try { AiResult.parse(JSONObject(raw), sp.getString("last_ai_date", null)) } catch (e: Exception) { null }
              }

              fun profiles(): List<Profile> = try {
                  val a = JSONArray(sp.getString("profiles", "[]"))
                  (0 until a.length()).map { i ->
                      val o = a.getJSONObject(i)
                      val v = o.getJSONArray("values")
                      Profile(o.getString("name"), o.getString("game"), (0 until v.length()).map { k -> v.getInt(k) }, o.getString("date"))
                  }
              } catch (e: Exception) { emptyList() }

              fun saveProfiles(list: List<Profile>) {
                  val a = JSONArray()
                  list.forEach { p ->
                      a.put(JSONObject().put("name", p.name).put("game", p.game).put("values", JSONArray(p.values)).put("date", p.date))
                  }
                  sp.edit().putString("profiles", a.toString()).apply()
              }
          }
          EOF_8
