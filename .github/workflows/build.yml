          package com.otimizador

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import rikka.shizuku.Shizuku
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var log: TextView
              private val REQ = 100

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, result ->
                  runOnUiThread {
                      append(if (result == PackageManager.PERMISSION_GRANTED) "Permissão concedida. Toque no botão de novo." else "Permissão negada.")
                  }
              }

              // ---------- SCRIPTS ----------

              private fun fluidez() = """
          echo '=== FLUIDEZ ==='
          echo '[1] Animações 0.5x'
          settings put global window_animation_scale 0.5
          settings put global transition_animation_scale 0.5
          settings put global animator_duration_scale 0.5
          echo '[2] Taxa de atualização alta'
          settings put system peak_refresh_rate 120.0
          settings put system min_refresh_rate 90.0
          echo '[3] Long press 300ms'
          settings put secure long_press_timeout 300
          echo '[4] Recompilando apps (pode demorar alguns minutos)'
          cmd package compile -m speed-profile -a
          echo '=== CONCLUÍDO ==='
          """

              private fun modoJogo(pkg: String) = """
          if ! pm path $pkg >/dev/null 2>&1; then echo 'Jogo não instalado: $pkg'; exit 0; fi
          echo '=== MODO JOGO: $pkg ==='
          echo '[1] Desligando economia de bateria'
          settings put global low_power 0
          echo '[2] Tela em taxa alta'
          settings put system peak_refresh_rate 120.0
          settings put system min_refresh_rate 90.0
          echo '[3] Modo desempenho do jogo (Android 12+)'
          cmd game mode performance $pkg
          cmd power set-fixed-performance-mode-enabled true
          echo '[4] Compilando o jogo'
          cmd package compile -m speed -f $pkg
          echo '[5] Limpando apps em segundo plano'
          am kill-all
          echo '=== PRONTO ==='
          """

              private fun limparCache() = """
          echo 'Limpando cache de todos os apps...'
          pm trim-caches 999999999999
          echo 'Feito.'
          """

              private fun fecharApps() = """
          echo 'Fechando apps em segundo plano...'
          am kill-all
          echo 'Feito.'
          """

              private fun animacoes() = """
          settings put global window_animation_scale 0.5
          settings put global transition_animation_scale 0.5
          settings put global animator_duration_scale 0.5
          echo 'Animações em 0.5x.'
          """

              private fun mouse(v: Int) = """
          settings put system pointer_speed $v
          echo 'Velocidade do ponteiro (mouse): $v  (faixa -7 a 7)'
          """

              private fun restaurar() = """
          settings put global window_animation_scale 1.0
          settings put global transition_animation_scale 1.0
          settings put global animator_duration_scale 1.0
          settings delete system peak_refresh_rate
          settings delete system min_refresh_rate
          settings put secure long_press_timeout 500
          settings put system pointer_speed 0
          cmd power set-fixed-performance-mode-enabled false
          echo 'Configurações restauradas ao padrão.'
          """

              // ---------- UI ----------

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(permListener)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 64, 32, 32)
                  }
                  fun btn(t: String, f: () -> Unit) {
                      root.addView(Button(this).apply {
                          text = t
                          isAllCaps = false
                          setOnClickListener { f() }
                      })
                  }

                  root.addView(TextView(this).apply {
                      text = "NitroCore"
                      textSize = 22f
                  })

                  btn("⚡ Fluidez geral + recompilar apps") { run("Fluidez", fluidez()) }
                  btn("🎮 Modo Jogo: Free Fire MAX") { run("Free Fire MAX", modoJogo("com.dts.freefiremax")) }
                  btn("🎮 Modo Jogo: Free Fire normal") { run("Free Fire", modoJogo("com.dts.freefireth")) }
                  btn("🧹 Limpar cache geral") { run("Limpar cache", limparCache()) }
                  btn("❌ Fechar apps em segundo plano") { run("Fechar apps", fecharApps()) }
                  btn("🎞️ Reduzir animações") { run("Animações", animacoes()) }
                  btn("🖱️ Mouse (GG Mouse Pro): ponteiro rápido") { run("Mouse", mouse(7)) }
                  btn("🖱️ Mouse: ponteiro padrão") { run("Mouse", mouse(0)) }
                  btn("♻️ Restaurar padrão") { run("Restaurar", restaurar()) }
                  btn("🎯 Assistente de Sensi (escolha seu celular)") { startActivity(Intent(this, SensiActivity::class.java)) }
                  btn("📋 Copiar scripts (p/ Brevent)") {
                      val txt = fluidez() + "\n" + modoJogo("com.dts.freefiremax")
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("scripts", txt))
                      append("Scripts copiados.")
                  }

                  log = TextView(this).apply { textSize = 13f; setPadding(0, 24, 0, 0) }
                  root.addView(log)

                  setContentView(ScrollView(this).apply { addView(root) })
                  append("Abra o Shizuku e deixe ele ativo antes de usar.")
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener)
                  super.onDestroy()
              }

              private fun append(s: String) { log.append(s + "\n") }

              private fun ready(): Boolean {
                  if (!Shizuku.pingBinder()) {
                      append("Shizuku não está rodando. Abra o app Shizuku e inicie.")
                      return false
                  }
                  if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                      Shizuku.requestPermission(REQ)
                      return false
                  }
                  return true
              }

              private fun run(name: String, script: String) {
                  if (!ready()) return
                  append("\n▶ $name")
                  thread {
                      try {
                          val m = Shizuku::class.java.getDeclaredMethod(
                              "newProcess",
                              Array<String>::class.java,
                              Array<String>::class.java,
                              String::class.java
                          )
                          m.isAccessible = true
                          val p = m.invoke(null, arrayOf("sh", "-c", "(" + script + ") 2>&1"), null, null) as Process
                          p.inputStream.bufferedReader().forEachLine { l -> runOnUiThread { append(l) } }
                          p.waitFor()
                          runOnUiThread { append("✔ terminou") }
                      } catch (e: Throwable) {
                          runOnUiThread { append("Erro: " + e.message) }
                      }
                  }
              }
          }
          EOF_6
          mkdir -p app/src/main/java/com/otimizador
          cat > app/src/main/java/com/otimizador/SensiActivity.kt <<'EOF_7'
          package com.otimizador

          import android.app.Activity
          import android.app.ActivityManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Build
          import android.os.Bundle
          import android.text.InputType
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView        import kotlin.math.roundToInt
          import kotlin.math.sqrt

          data class Phone(val brand: String, val model: String, val diag: Double, val hz: Int, val tier: Int)

          object PhoneDb {
              // tier: 1 = básico, 2 = intermediário, 3 = topo de linha (valores aproximados)
              val phones = listOf(
                  Phone("Motorola", "Moto G04", 6.56, 90, 1),
                  Phone("Motorola", "Moto G24", 6.56, 90, 1),
                  Phone("Motorola", "Moto G34 5G", 6.5, 120, 2),
                  Phone("Motorola", "Moto G54 5G", 6.5, 120, 2),
                  Phone("Motorola", "Moto G84 5G", 6.5, 120, 2),
                  Phone("Motorola", "Moto G85", 6.67, 120, 2),
                  Phone("Motorola", "Edge 40 Neo", 6.55, 144, 2),
                  Phone("Motorola", "Edge 50 Fusion", 6.7, 120, 2),
                  Phone("Samsung", "Galaxy A04", 6.5, 60, 1),
                  Phone("Samsung", "Galaxy A14", 6.6, 90, 1),
                  Phone("Samsung", "Galaxy A15", 6.5, 90, 1),
                  Phone("Samsung", "Galaxy A25 5G", 6.5, 120, 2),
                  Phone("Samsung", "Galaxy A35 5G", 6.6, 120, 2),
                  Phone("Samsung", "Galaxy A54 5G", 6.4, 120, 2),
                  Phone("Samsung", "Galaxy A55 5G", 6.6, 120, 2),
                  Phone("Samsung", "Galaxy M14", 6.6, 90, 1),
                  Phone("Samsung", "Galaxy S23", 6.1, 120, 3),
                  Phone("Samsung", "Galaxy S24", 6.2, 120, 3),
                  Phone("Samsung", "Galaxy S24 Ultra", 6.8, 120, 3),
                  Phone("Xiaomi / Redmi / Poco", "Redmi 12C", 6.71, 60, 1),
                  Phone("Xiaomi / Redmi / Poco", "Redmi 12", 6.79, 90, 1),
                  Phone("Xiaomi / Redmi / Poco", "Redmi Note 12", 6.67, 120, 2),
                  Phone("Xiaomi / Redmi / Poco", "Redmi Note 13", 6.67, 120, 2),
                  Phone("Xiaomi / Redmi / Poco", "Redmi Note 13 Pro", 6.67, 120, 2),
                  Phone("Xiaomi / Redmi / Poco", "Poco C65", 6.74, 90, 1),
                  Phone("Xiaomi / Redmi / Poco", "Poco M6", 6.79, 90, 1),
                  Phone("Xiaomi / Redmi / Poco", "Poco X5 Pro", 6.67, 120, 2),
                  Phone("Xiaomi / Redmi / Poco", "Poco X6 Pro", 6.67, 120, 3),
                  Phone("Xiaomi / Redmi / Poco", "Poco F5", 6.67, 120, 3),
                  Phone("Infinix", "Hot 40i", 6.56, 90, 1),
                  Phone("Infinix", "Hot 40 Pro", 6.78, 120, 1),
                  Phone("Infinix", "Note 40", 6.78, 120, 2),
                  Phone("Realme", "C55", 6.72, 90, 1),
                  Phone("Realme", "C67", 6.72, 90, 1),
                  Phone("Realme", "12 Pro", 6.7, 120, 2),
                  Phone("Gamer", "ASUS ROG Phone 8", 6.78, 165, 3),
                  Phone("Gamer", "Red Magic 9 Pro", 6.8, 120, 3)
              )

              fun brands(): List<String> = phones.map { it.brand }.distinct()
          }

          class SensiActivity : Activity() {

              private val DETECT = "📱 Meu aparelho (detectar)"
              private val MANUAL = "✏️ Outro (digitar dados)"

              private lateinit var brandSp: Spinner
              private lateinit var modelSp: Spinner
              private lateinit var styleSp: Spinner
              private lateinit var fingersSp: Spinner
              private lateinit var tierSp: Spinner
              private lateinit var manualBox: LinearLayout
              private lateinit var inchEt: EditText
              private lateinit var hzEt: EditText
              private lateinit var result: TextView
              private var lastText = ""

              private fun label(t: String) = TextView(this).apply {
                  text = t
                  textSize = 14f
                  setPadding(0, 24, 0, 4)
              }

              private fun spinner(items: List<String>) = Spinner(this).apply {
                  adapter = ArrayAdapter(this@SensiActivity, android.R.layout.simple_spinner_dropdown_item, items)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 64, 32, 48)
                  }

                  root.addView(TextView(this).apply {
                      text = "🎯 Assistente de Sensi"
                      textSize = 22f
                  })
                  root.addView(TextView(this).apply {
                      text = "Escolha seu celular e seu estilo. O assistente calcula valores iniciais de sensibilidade para o Free Fire."
                      textSize = 13f
                      setPadding(0, 8, 0, 8)
                  })

                  root.addView(label("Marca"))
                  brandSp = spinner(listOf(DETECT) + PhoneDb.brands() + listOf(MANUAL))
                  root.addView(brandSp)

                  root.addView(label("Modelo"))
                  modelSp = spinner(listOf("-"))
                  root.addView(modelSp)

                  manualBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                  }
                  inchEt = EditText(this).apply {
                      hint = "Tamanho da tela em polegadas (ex: 6.5)"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  }
                  hzEt = EditText(this).apply {
                      hint = "Taxa de atualização em Hz (ex: 90)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }
                  tierSp = spinner(listOf("Básico", "Intermediário", "Topo de linha"))
                  manualBox.addView(inchEt)
                  manualBox.addView(hzEt)
                  manualBox.addView(tierSp)
                  root.addView(manualBox)

                  root.addView(label("Estilo de jogo"))
                  styleSp = spinner(listOf("Rush (agressivo)", "Equilibrado", "Preciso (controle / sniper)"))
                  styleSp.setSelection(1)
                  root.addView(styleSp)

                  root.addView(label("Quantos dedos você usa?"))
                  fingersSp = spinner(listOf("2 dedos (polegares)", "3 dedos", "4 dedos (garra)"))
                  root.addView(fingersSp)

                  root.addView(Button(this).apply {
                      text = "⚡ Gerar sensibilidade"
                      isAllCaps = false
                      setOnClickListener { generate() }
                  })

                  result = TextView(this).apply {
                      textSize = 15f
                      setPadding(0, 24, 0, 8)
                      setTextIsSelectable(true)
                  }
                  root.addView(result)

                  root.addView(Button(this).apply {
                      text = "📋 Copiar valores"
                      isAllCaps = false
                      setOnClickListener { copy() }
                  })

                  setContentView(ScrollView(this).apply { addView(root) })

                  brandSp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          refreshModels()
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  refreshModels()
              }

              private fun setModels(items: List<String>) {
                  modelSp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, items)
              }

              private fun refreshModels() {
                  val b = brandSp.selectedItem as String
                  when (b) {
                      DETECT -> {
                          manualBox.visibility = View.GONE
                          setModels(listOf("(automático)"))
                      }
                      MANUAL -> {
                          manualBox.visibility = View.VISIBLE
                          setModels(listOf("-"))
                      }
                      else -> {
                          manualBox.visibility = View.GONE
                          setModels(PhoneDb.phones.filter { it.brand == b }.map { it.model })
                      }
                  }
              }

              @Suppress("DEPRECATION")
              private fun detect(): Phone {
                  val dm = resources.displayMetrics
                  val wi = dm.widthPixels / dm.xdpi.toDouble()
                  val hi = dm.heightPixels / dm.ydpi.toDouble()
                  val diag = (sqrt(wi * wi + hi * hi) * 10).roundToInt() / 10.0
                  val hz = windowManager.defaultDisplay.refreshRate.roundToInt()
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val gb = mi.totalMem / 1024.0 / 1024.0 / 1024.0
                  val tier = if (gb < 3.5) 1 else if (gb < 7.0) 2 else 3
                  return Phone(Build.MANUFACTURER.uppercase(), Build.MODEL, diag, hz, tier)
              }

              private fun currentPhone(): Phone? {
                  val b = brandSp.selectedItem as String
                  if (b == DETECT) return detect()
                  if (b == MANUAL) {
                      val d = inchEt.text.toString().replace(',', '.').toDoubleOrNull()
                      val h = hzEt.text.toString().toIntOrNull()
                      if (d == null || h == null) return null
                      return Phone("Manual", "Aparelho informado", d, h, tierSp.selectedItemPosition + 1)
                  }
                  val m = modelSp.selectedItem as String
                  return PhoneDb.phones.firstOrNull { it.brand == b && it.model == m }
              }

              private fun calc(p: Phone, style: Int, fingers: Int): List<Pair<String, Int>> {
                  val base = when (style) {
                      0 -> intArrayOf(95, 90, 85, 80, 70, 75)
                      1 -> intArrayOf(85, 80, 75, 70, 60, 65)
                      else -> intArrayOf(75, 70, 62, 55, 45, 55)
                  }
                  var adj = 0
                  adj += when (p.tier) {
                      1 -> -5
                      3 -> 3
                      else -> 0
                  }
                  adj += if (p.diag >= 6.7) 4 else if (p.diag < 6.3) -3 else 0
                  adj += if (p.hz >= 120) 3 else if (p.hz <= 60) -3 else 0
                  adj += when (fingers) {
                      0 -> 5
                      1 -> 2
                      else -> 0
                  }
                  val names = listOf("Geral", "Ponto vermelho", "Mira 2x", "Mira 4x", "Mira AWM", "Olhar livre")
                  return names.indices.map { i -> Pair(names[i], (base[i] + adj).coerceIn(1, 100)) }
              }

              private fun generate() {
                  val p = currentPhone()
                  if (p == null) {
                      result.text = "Preencha o tamanho da tela (em polegadas) e os Hz."
                      return
                  }
                  val vals = calc(p, styleSp.selectedItemPosition, fingersSp.selectedItemPosition)
                  val tierName = when (p.tier) {
                      1 -> "básico"
                      3 -> "topo de linha"
                      else -> "intermediário"
                  }
                  val sb = StringBuilder()
                  sb.append("📱 ${p.brand} ${p.model}\n")
                  sb.append("Tela ${p.diag} pol · ${p.hz} Hz · nível $tierName\n")
                  sb.append("Estilo: ${styleSp.selectedItem} · ${fingersSp.selectedItem}\n\n")
                  for ((n, v) in vals) sb.append("$n: $v\n")
                  sb.append("\nDicas:\n")
                  if (p.tier == 1) sb.append("• Aparelho básico: use gráficos baixos e priorize FPS estável. Sensi muito alta fica difícil de controlar.\n")
                  if (p.hz <= 60) sb.append("• Tela de 60 Hz: a mira parece menos suave, então não exagere no Geral.\n")
                  else sb.append("• Ative a maior taxa de atualização disponível (botão Fluidez do app).\n")
                  sb.append("• São valores iniciais. Teste no treino e ajuste de 3 em 3 pontos.\n")
                  sb.append("• Se a mira passa do alvo, diminua. Se não acompanha, aumente.\n")
                  sb.append("• Digite esses valores no jogo (Configurações > Sensibilidade). O app não altera o jogo.\n")
                  lastText = sb.toString()
                  result.text = lastText
              }

              private fun copy() {
                  if (lastText.isEmpty()) {
                      result.text = "Gere a sensibilidade primeiro."
                      return
                  }
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("sensi", lastText))
                  result.text = lastText + "\n✔ Copiado."
              }
          }
          EOF_7

