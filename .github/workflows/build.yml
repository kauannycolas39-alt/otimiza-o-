name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar projeto
        run: |
          cat > README.md <<'EOF_0'
          # NitroCore

          App Android (Kotlin + Jetpack Compose) de otimização e assistente de sensibilidade.

          ## Instalar (só com o celular)
          1. Crie um repositório no GitHub e adicione `.github/workflows/build.yml`.
          2. Aba Ações > Build APK > baixe o artefato `Otimizador-APK` e instale `app-debug.apk`.
          3. Instale e inicie o app Shizuku (para as otimizações avançadas).
          Desinstale a versão anterior antes: cada build tem uma assinatura debug diferente.

          ## O que funciona de verdade
          - Status do aparelho (RAM, armazenamento, bateria, temperatura quando o sistema informa).
          - Abrir Free Fire Normal/MAX, favorita salva, link da Play Store se não instalado.
          - Limpar RAM, cache e modo desempenho de jogo: **somente com Shizuku ativo** (Android 12+ para o modo de jogo).
          - Limpar arquivos: apaga só o cache temporário do próprio app, com confirmação.
          - Cálculo local de sensibilidade, sliders por jogo, feedback, perfis salvos, tema.

          ## O que exige configuração
          - **Sensi com IA / Buscar sensi atualizada**: suba o backend (pasta `backend/`), coloque a URL HTTPS em Ajustes > Assistente de IA e aceite o consentimento.
          - Busca atualizada exige `SEARCH_API_KEY` (Brave Search). Sem ela, o app mostra "Não foi possível confirmar recomendações recentes".

          ## Demonstração / em breve
          Notificações, otimização automática, outros idiomas, textos de privacidade e termos (exemplo).

          ## Backend
          ```
          cd backend
          npm install
          cp .env.example .env   # preencha e exporte as variáveis (ou use o painel da hospedagem)
          node server.js
          ```
          Variáveis: `AI_PROVIDER` (anthropic|openai), `AI_API_KEY`, `AI_MODEL`, `SEARCH_API_KEY`, `OPENAI_BASE_URL`, `PORT`. As chaves nunca vão no app. Hospede com HTTPS.

          ## Permissões
          INTERNET e ACCESS_NETWORK_STATE (IA), permissão do Shizuku, consulta aos pacotes do Free Fire (`<queries>`).

          ## Limitações
          - O app **não altera** configurações nem arquivos de nenhum jogo, não injeta código e não usa macros. Sensibilidade é sempre digitada manualmente no jogo.
          - Sem Shizuku, o Android não permite limpar RAM/cache de outros apps: o app explica e abre as configurações.
          - Escalas de PUBG e CODM são aproximadas; confira os limites no jogo.
          - Valores de sensibilidade são sugestões para teste, sem garantia de resultado.
          - Não afiliado à Garena nem a outras desenvolvedoras.
          EOF_0
