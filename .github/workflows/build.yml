                  ActionRow(Icons.Default.Build, "Otimização completa", "RAM + cache + jogos, só o que estiver disponível.", "Executar", running == null) {
                      runAction("Otimização completa") { Optimizer.full(ctx) }
                  }

                  AnimatedVisibility(visible = results.isNotEmpty()) {
                      NCard(border = Blue) {
                          Title("Resultado")
                          Muted("Resultados reais desta execução. Nada nesta tela é simulado.")
                          results.forEach { r ->
