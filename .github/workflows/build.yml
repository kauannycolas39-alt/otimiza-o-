          package com.otimizador

          data class SliderDef(val name: String, val min: Int, val max: Int, val basePct: Int, val def: Int)

          private fun s(n: String, mn: Int, mx: Int, b: Int, d: Int) = SliderDef(n, mn, mx, b, d)

          private fun ffSliders() = listOf(
              s("Sensibilidade geral", 0, 100, 85, 50), s("Ponto vermelho", 0, 100, 80, 50),
              s("Mira 2x", 0, 100, 75, 50), s("Mira 4x", 0, 100, 70, 50),
              s("Mira AWM", 0, 100, 60, 50), s("Olhar livre", 0, 100, 65, 50)
          )

          enum class Game(val label: String, val pkg: String?, val sliders: List<SliderDef>, val howTo: String) {
              FF("Free Fire Normal", "com.dts.freefireth", ffSliders(),
                  "Abra o Free Fire > engrenagem (Configurações) > aba Sensibilidade. Ajuste cada barra para o valor indicado e teste no treino."),
              FFMAX("Free Fire MAX", "com.dts.freefiremax", ffSliders(),
                  "Abra o Free Fire MAX > engrenagem (Configurações) > aba Sensibilidade. Ajuste cada barra para o valor indicado e teste no treino."),
              PUBG("PUBG Mobile", "com.tencent.ig", listOf(
                  s("Câmera (sem mira)", 1, 300, 38, 100), s("Ponto vermelho", 1, 300, 30, 50),
                  s("Mira 2x", 1, 300, 26, 40), s("Mira 4x", 1, 300, 22, 30)),
                  "No PUBG Mobile: Configurações > Sensibilidade. A escala aqui é aproximada: confira os limites no seu jogo."),
              CODM("Call of Duty Mobile", "com.activision.callofduty.shooter", listOf(
                  s("Câmera (multijogador)", 0, 200, 50, 100), s("Mira (ADS) geral", 0, 200, 50, 100),
                  s("Ponto vermelho", 0, 200, 48, 100), s("Sniper", 0, 200, 40, 80)),
                  "No CODM: Configurações > Controles > Sensibilidade. A escala aqui é aproximada: confira os limites no seu jogo."),
              OUTROS("Outros", null, listOf(
                  s("Sensibilidade geral", 0, 100, 60, 50), s("Mira", 0, 100, 55, 50), s("Olhar livre", 0, 100, 55, 50)),
                  "Procure a opção Sensibilidade nas configurações do seu jogo e use os valores como ponto de partida, adaptando à escala dele.")
          }

          data class DeviceProfile(val brand: String, val model: String, val ramGb: Double, val hz: Int, val tier: Int, val diag: Double)

          data class DeviceStatus(
              val ramUsedMb: Long, val ramTotalMb: Long,
              val storageUsedGb: Double, val storageTotalGb: Double,
              val tempC: Float?, val batteryPct: Int?
          )

          data class ActionResult(val title: String, val ok: Boolean, val message: String, val settingsAction: String? = null)

          data class Profile(val name: String, val game: String, val values: List<Int>, val date: String)

          data class Source(val title: String, val url: String, val published: String?, val consulted: String?)

          data class AiResult(
              val values: Map<String, Int>, val explanation: String,
              val sources: List<Source>, val verified: Boolean, val savedAt: String? = null
          ) {
              companion object {
                  fun parse(j: org.json.JSONObject, savedAt: String? = null): AiResult {
                      val vals = mutableMapOf<String, Int>()
                      j.optJSONObject("values")?.let { o -> o.keys().forEach { k -> vals[k] = o.optInt(k) } }
                      val srcs = mutableListOf<Source>()
                      j.optJSONArray("sources")?.let { a ->
                          for (i in 0 until a.length()) {
                              val x = a.getJSONObject(i)
                              srcs.add(Source(x.optString("title"), x.optString("url"),
                                  x.optString("publishedAt").ifBlank { null }, x.optString("consultedAt").ifBlank { null }))
                          }
                      }
                      return AiResult(vals, j.optString("explanation"), srcs, j.optBoolean("verified", false), savedAt)
                  }
              }
          }
