                              }
                              Button(onClick = { launch(Prefs.gamerAuto) }, modifier = Modifier.fillMaxWidth()) { Text("Abrir agora") }
                              OutlinedButton(onClick = { launch(true) }, modifier = Modifier.fillMaxWidth()) { Text("Otimizar antes de jogar") }
                              TextButton(onClick = { ffDialog = false }) { Text("Cancelar") }
