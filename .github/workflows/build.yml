              fun runAction(name: String, block: () -> List<ActionResult>) {
                  if (running != null) return
                  running = name
                  thread {
                      val r = try { block() } catch (e: Throwable) { listOf(ActionResult(name, false, "Erro: ${e.message}")) }
                      results = r
                      status = Device.status(ctx)
                      running = null
