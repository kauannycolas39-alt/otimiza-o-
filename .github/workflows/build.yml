          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.Icon
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.NavigationBar
          import androidx.compose.material3.NavigationBarItem
          import androidx.compose.material3.Scaffold
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import rikka.shizuku.Shizuku

          object AppState {
              val tick = mutableStateOf(0)
              fun bump() { tick.value = tick.value + 1 }
          }

          class MainActivity : ComponentActivity() {
              private val permListener = Shizuku.OnRequestPermissionResultListener { _, _ -> AppState.bump() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Prefs.init(applicationContext)
                  Shizuku.addRequestPermissionResultListener(permListener)
                  setContent { App() }
              }

              override fun onResume() {
                  super.onResume()
                  AppState.bump()
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener)
                  super.onDestroy()
              }
          }

          @Composable
          fun App() {
              var theme by remember { mutableStateOf(Prefs.theme) }
              NitroTheme(theme) {
                  var tab by remember { mutableStateOf(0) }
                  Scaffold(
                      containerColor = MaterialTheme.colorScheme.background,
                      bottomBar = {
                          NavigationBar {
                              NavigationBarItem(selected = tab == 0, onClick = { tab = 0 },
                                  icon = { Icon(Icons.Default.Build, contentDescription = null) }, label = { Text("Otimizar") })
                              NavigationBarItem(selected = tab == 1, onClick = { tab = 1 },
                                  icon = { Icon(Icons.Default.Edit, contentDescription = null) }, label = { Text("Sensibilidade") })
                              NavigationBarItem(selected = tab == 2, onClick = { tab = 2 },
                                  icon = { Icon(Icons.Default.Settings, contentDescription = null) }, label = { Text("Ajustes") })
                          }
                      }
                  ) { pad ->
                      Box(Modifier.padding(pad).fillMaxSize()) {
                          when (tab) {
                              0 -> OtimizarScreen()
                              1 -> SensiScreen()
                              else -> ConfigScreen(theme) { theme = it; Prefs.theme = it }
                          }
                      }
                  }
              }
          }
