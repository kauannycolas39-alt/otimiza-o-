name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar projeto
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Otimizador"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.otimizador"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.otimizador"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:label="NitroCore"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/otimizador
          cat > app/src/main/java/com/otimizador/MainActivity.kt <<'EOF_5'
          package com.otimizador

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import rikka.shizuku.Shizuku
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var log: TextView
              private val REQ = 100

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, result ->
                  runOnUiThread {
                      append(if (result == PackageManager.PERMISSION_GRANTED) "Permissão concedida. Toque no botão de novo." else "Permissão negada.")
                  }
              }

              // ---------- SCRIPTS ----------

              private fun fluidez() = """
          echo '=== FLUIDEZ ==='
          echo '[1] Animações 0.5x'
          settings put global window_animation_scale 0.5
          settings put global transition_animation_scale 0.5
          settings put global animator_duration_scale 0.5
          echo '[2] Taxa de atualização alta'
          settings put system peak_refresh_rate 120.0
          settings put system min_refresh_rate 90.0
          echo '[3] Long press 300ms'
          settings put secure long_press_timeout 300
          echo '[4] Recompilando apps (pode demorar alguns minutos)'
          cmd package compile -m speed-profile -a
          echo '=== CONCLUÍDO ==='
          """

              private fun modoJogo(pkg: String) = """
          if ! pm path $pkg >/dev/null 2>&1; then echo 'Jogo não instalado: $pkg'; exit 0; fi
          echo '=== MODO JOGO: $pkg ==='
          echo '[1] Desligando economia de bateria'
          settings put global low_power 0
          echo '[2] Tela em taxa alta'
          settings put system peak_refresh_rate 120.0
          settings put system min_refresh_rate 90.0
          echo '[3] Modo desempenho do jogo (Android 12+)'
          cmd game mode performance $pkg
          cmd power set-fixed-performance-mode-enabled true
          echo '[4] Compilando o jogo'
          cmd package compile -m speed -f $pkg
          echo '[5] Limpando apps em segundo plano'
          am kill-all
          echo '=== PRONTO ==='
          """

              private fun limparCache() = """
          echo 'Limpando cache de todos os apps...'
          pm trim-caches 999999999999
          echo 'Feito.'
          """

              private fun fecharApps() = """
          echo 'Fechando apps em segundo plano...'
          am kill-all
          echo 'Feito.'
          """

              private fun animacoes() = """
          settings put global window_animation_scale 0.5
          settings put global transition_animation_scale 0.5
          settings put global animator_duration_scale 0.5
          echo 'Animações em 0.5x.'
          """

              private fun mouse(v: Int) = """
          settings put system pointer_speed $v
          echo 'Velocidade do ponteiro (mouse): $v  (faixa -7 a 7)'
          """

              private fun restaurar() = """
          settings put global window_animation_scale 1.0
          settings put global transition_animation_scale 1.0
          settings put global animator_duration_scale 1.0
          settings delete system peak_refresh_rate
          settings delete system min_refresh_rate
          settings put secure long_press_timeout 500
          settings put system pointer_speed 0
          cmd power set-fixed-performance-mode-enabled false
          echo 'Configurações restauradas ao padrão.'
          """

              // ---------- UI ----------

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(permListener)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 64, 32, 32)
                  }
                  fun btn(t: String, f: () -> Unit) {
                      root.addView(Button(this).apply {
                          text = t
                          isAllCaps = false
                          setOnClickListener { f() }
                      })
                  }

                  root.addView(TextView(this).apply {
                      text = "NitroCore"
                      textSize = 22f
                  })

                  btn("⚡ Fluidez geral + recompilar apps") { run("Fluidez", fluidez()) }
                  btn("🎮 Modo Jogo: Free Fire MAX") { run("Free Fire MAX", modoJogo("com.dts.freefiremax")) }
                  btn("🎮 Modo Jogo: Free Fire normal") { run("Free Fire", modoJogo("com.dts.freefireth")) }
                  btn("🧹 Limpar cache geral") { run("Limpar cache", limparCache()) }
                  btn("❌ Fechar apps em segundo plano") { run("Fechar apps", fecharApps()) }
                  btn("🎞️ Reduzir animações") { run("Animações", animacoes()) }
                  btn("🖱️ Mouse (GG Mouse Pro): ponteiro rápido") { run("Mouse", mouse(7)) }
                  btn("🖱️ Mouse: ponteiro padrão") { run("Mouse", mouse(0)) }
                  btn("♻️ Restaurar padrão") { run("Restaurar", restaurar()) }
                  btn("📋 Copiar scripts (p/ Brevent)") {
                      val txt = fluidez() + "\n" + modoJogo("com.dts.freefiremax")
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("scripts", txt))
                      append("Scripts copiados.")
                  }

                  log = TextView(this).apply { textSize = 13f; setPadding(0, 24, 0, 0) }
                  root.addView(log)

                  setContentView(ScrollView(this).apply { addView(root) })
                  append("Abra o Shizuku e deixe ele ativo antes de usar.")
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener)
                  super.onDestroy()
              }

              private fun append(s: String) { log.append(s + "\n") }

              private fun ready(): Boolean {
                  if (!Shizuku.pingBinder()) {
                      append("Shizuku não está rodando. Abra o app Shizuku e inicie.")
                      return false
                  }
                  if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                      Shizuku.requestPermission(REQ)
                      return false
                  }
                  return true
              }

              private fun run(name: String, script: String) {
                  if (!ready()) return
                  append("\n▶ $name")
                  thread {
                      try {
                          val m = Shizuku::class.java.getDeclaredMethod(
                              "newProcess",
                              Array<String>::class.java,
                              Array<String>::class.java,
                              String::class.java
                          )
                          m.isAccessible = true
                          val p = m.invoke(null, arrayOf("sh", "-c", "(" + script + ") 2>&1"), null, null) as Process
                          p.inputStream.bufferedReader().forEachLine { l -> runOnUiThread { append(l) } }
                          p.waitFor()
                          runOnUiThread { append("✔ terminou") }
                      } catch (e: Throwable) {
                          runOnUiThread { append("Erro: " + e.message) }
                      }
                  }
              }
          }
          EOF_5
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png <<'EOF_ICON'
