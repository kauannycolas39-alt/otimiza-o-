          cat > app/src/main/java/com/otimizador/services/Services.kt <<'EOF_9'
          package com.otimizador

          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.display.DisplayManager
          import android.net.ConnectivityManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import android.provider.Settings
          import android.view.Display
          import org.json.JSONObject
          import rikka.shizuku.Shizuku
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          /** Execução de comandos de shell via Shizuku (sem root). */
          object Shell {
              fun status(): String = try {
                  if (!Shizuku.pingBinder()) "inativo"
                  else if (Shizuku.checkSelfPermission() != android.content.pm.PackageManager.PERMISSION_GRANTED) "sem permissão"
                  else "pronto"
              } catch (e: Throwable) { "inativo" }

              fun available(): Boolean = status() == "pronto"

              fun requestPermission() { try { Shizuku.requestPermission(100) } catch (e: Throwable) { } }

              fun run(script: String): Pair<Boolean, String> = try {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java)
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", "($script) 2>&1"), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText()
                  Pair(p.waitFor() == 0, out.trim())
              } catch (e: Throwable) { Pair(false, e.message ?: "erro") }
          }

          /** Leitura real de dados do aparelho. Dado indisponível = null. */
          object Device {
              fun status(ctx: Context): DeviceStatus {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val sf = StatFs(Environment.getDataDirectory().path)
                  val total = sf.blockCountLong * sf.blockSizeLong
                  val free = sf.availableBlocksLong * sf.blockSizeLong
                  val gb = 1024.0 * 1024.0 * 1024.0
                  val b = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val lvl = b?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val sc = b?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  val t = b?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, Int.MIN_VALUE) ?: Int.MIN_VALUE
                  return DeviceStatus(
                      (mi.totalMem - mi.availMem) / 1048576L, mi.totalMem / 1048576L,
                      (total - free) / gb, total / gb,
                      if (t == Int.MIN_VALUE || t <= 0) null else t / 10f,
                      if (lvl >= 0 && sc > 0) lvl * 100 / sc else null
                  )
              }

              fun detect(ctx: Context): DeviceProfile {
                  val dm = ctx.resources.displayMetrics
                  val wi = dm.widthPixels / dm.xdpi.toDouble()
                  val hi = dm.heightPixels / dm.ydpi.toDouble()
                  val diag = (sqrt(wi * wi + hi * hi) * 10).roundToInt() / 10.0
                  val d = (ctx.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager).getDisplay(Display.DEFAULT_DISPLAY)
                  val hz = d?.refreshRate?.roundToInt() ?: 60
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val ram = mi.totalMem / 1024.0 / 1024.0 / 1024.0
                  val tier = if (ram < 3.5) 1 else if (ram < 7.0) 2 else 3
                  return DeviceProfile(Build.MANUFACTURER.uppercase(), Build.MODEL, ram, hz, tier, diag)
              }
          }

          object Net {
              fun online(ctx: Context): Boolean = try {
                  val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val n = cm.activeNetwork
                  val c = if (n != null) cm.getNetworkCapabilities(n) else null
                  c != null && c.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET)
              } catch (e: Exception) { false }
          }

          /** Abertura dos jogos pelos mecanismos oficiais do Android. */
          object Games {
              fun installed(ctx: Context, pkg: String): Boolean = try {
                  ctx.packageManager.getPackageInfo(pkg, 0); true
              } catch (e: Exception) { false }

              fun launch(ctx: Context, pkg: String): Boolean {
                  val i = ctx.packageManager.getLaunchIntentForPackage(pkg) ?: return false
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(i)
                  return true
              }

              fun openStore(ctx: Context, pkg: String) {
                  try {
                      ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$pkg")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      try {
                          ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=$pkg")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      } catch (e2: Exception) { }
                  }
              }

              fun openSettings(ctx: Context, action: String) {
                  try { ctx.startActivity(Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (e: Exception) { }
              }
          }

          /** Otimizações. Só executa o que o Android (com ou sem Shizuku) realmente permite. */
          object Optimizer {
              private val FF = listOf("com.dts.freefireth", "com.dts.freefiremax")
              private const val NEED = "Não executado: o Android não permite essa ação para apps comuns. Ative o Shizuku e conceda a permissão, ou use as configurações do sistema."

              fun clearRam(ctx: Context): ActionResult {
                  val t = "Limpar RAM"
                  if (!Shell.available()) return ActionResult(t, false, NEED, Settings.ACTION_APPLICATION_SETTINGS)
                  val before = Device.status(ctx).ramUsedMb
                  val r = Shell.run("am kill-all")
                  val after = Device.status(ctx).ramUsedMb
                  return if (r.first) ActionResult(t, true, "Executado via Shizuku. RAM em uso: $before MB → $after MB (medido pelo sistema; o Android pode reabrir apps).")
                  else ActionResult(t, false, "Falhou: ${r.second}")
              }

              fun clearCache(ctx: Context): ActionResult {
                  val t = "Limpar cache"
                  if (!Shell.available()) return ActionResult(t, false, NEED, Settings.ACTION_INTERNAL_STORAGE_SETTINGS)
                  val r = Shell.run("pm trim-caches 999999999999")
                  return if (r.first) ActionResult(t, true, "Executado via Shizuku: cache dos apps liberado.")
                  else ActionResult(t, false, "Falhou: ${r.second}")
              }

              fun speedGames(ctx: Context): ActionResult {
                  val t = "Acelerar jogos"
                  val inst = FF.filter { Games.installed(ctx, it) }
                  if (inst.isEmpty()) return ActionResult(t, false, "Nenhuma versão do Free Fire instalada para otimizar.")
                  if (!Shell.available()) return ActionResult(t, false, NEED, Settings.ACTION_SETTINGS)
                  val sb = StringBuilder()
                  var ok = true
                  inst.forEach { p ->
                      val r = Shell.run("cmd game mode performance $p")
                      if (!r.first) ok = false
                      sb.append("$p: ${if (r.first) "modo desempenho aplicado" else "falhou (${r.second.take(60)})"}\n")
                  }
                  return ActionResult(t, ok, sb.toString().trim() + "\n(Requer Android 12 ou superior.)")
              }

              fun battery(): ActionResult = ActionResult("Economizar bateria", false,
                  "O Android não deixa apps ativarem a economia de bateria diretamente. Toque para abrir as configurações.",
                  Settings.ACTION_BATTERY_SAVER_SETTINGS)

              fun cleanOwnCache(ctx: Context): ActionResult {
                  var freed = 0L
                  fun del(f: File) { if (f.isDirectory) f.listFiles()?.forEach { del(it) } else freed += f.length(); f.delete() }
                  ctx.cacheDir.listFiles()?.forEach { del(it) }
                  return ActionResult("Limpar arquivos desnecessários", true,
                      "Cache temporário do NitroCore apagado: ${freed / 1024} KB liberados. Outros arquivos exigem permissão especial e não foram tocados.",
                      Settings.ACTION_INTERNAL_STORAGE_SETTINGS)
              }

              fun full(ctx: Context): List<ActionResult> = listOf(clearRam(ctx), clearCache(ctx), speedGames(ctx))

              fun beforeGame(ctx: Context): List<ActionResult> = listOf(clearRam(ctx), speedGames(ctx))
          }

          /** Lógica local de sugestão (sem IA). */
          object SensiEngine {
              fun suggest(game: Game, d: DeviceProfile, style: Int, fbAdj: Int): List<Int> {
                  var adj = 0
                  adj += when (d.tier) { 1 -> -5; 3 -> 3; else -> 0 }
                  adj += if (d.hz >= 120) 3 else if (d.hz <= 60) -3 else 0
                  adj += if (d.diag >= 6.7) 4 else if (d.diag >= 1.0 && d.diag < 6.3) -3 else 0
                  adj += when (style) { 0 -> -10; 1 -> 10; else -> 0 }
                  adj += fbAdj
                  return game.sliders.map { s ->
                      val pct = (s.basePct + adj).coerceIn(2, 100)
                      (s.min + (s.max - s.min) * pct / 100.0).roundToInt().coerceIn(s.min, s.max)
                  }
              }
          }

          /** Provedor de IA trocável: o app só fala com o seu backend. */
          class AiException(msg: String) : Exception(msg)

          interface AiProvider {
              fun sensi(payload: JSONObject): JSONObject
              fun searchSensi(payload: JSONObject): JSONObject
          }

          class BackendProvider(private val baseUrl: String) : AiProvider {
              private fun post(path: String, body: JSONObject): JSONObject {
                  val c = URL(baseUrl.trim().trimEnd('/') + path).openConnection() as HttpURLConnection
                  try {
                      c.requestMethod = "POST"
                      c.connectTimeout = 15000
                      c.readTimeout = 60000
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = c.responseCode
                      val st = if (code in 200..299) c.inputStream else c.errorStream
                      val text = st?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code == 429) throw AiException("Limite de uso atingido. Tente novamente mais tarde.")
                      if (code !in 200..299) throw AiException("Erro do servidor ($code).")
                      return JSONObject(text)
                  } finally { c.disconnect() }
              }

              override fun sensi(payload: JSONObject) = post("/api/sensi", payload)
              override fun searchSensi(payload: JSONObject) = post("/api/search-sensi", payload)
          }
