          /** Execução de comandos de shell via Shizuku (sem root). */
          object Shell {
              fun status(): String = try {
                  if (!Shizuku.pingBinder()) "inativo"
                  else if (Shizuku.checkSelfPermission() != android.content.pm.PackageManager.PERMISSION_GRANTED) "sem permissão"
                  else "pronto"
              } catch (e: Throwable) { "inativo" }

              fun available(): Boolean = status() == "pronto"

              fun requestPermission() { try { Shizuku.requestPermission(100) } catch (e: Throwable) { } }

              fun run(script: String): Pair<Boolean, String> = try {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java)
                
