                  set(v) { sp.edit().putString("backend_url", v).apply() }

              fun saveLastAi(json: String) {
                  sp.edit().putString("last_ai", json).putString("last_ai_date", now()).apply()
              }

              fun lastAi(): AiResult? {
                  val raw = sp.getString("last_ai", null) ?: return null
                  return try { AiResult.parse(JSONObject(raw), sp.getString("last_ai_date", null)) } catch (e: Exception) { null }
              }

              fun profiles(): List<Profile> = try {
                  val a = JSONArray(sp.getString("profiles", "[]"))
                  (0 until a.length()).map { i ->
                      val o = a.getJSONObject(i)
                      val v = o.getJSONArray("values")
                      Profile(o.getString("name"), o.getString("game"), (0 until v.length()).map { k -> v.getInt(k) }, o.getString("date"))
                  }
              } catch (e: Exception) { emptyList() }

              fun saveProfiles(list: List<Profile>) {
                  val a = JSONArray()
                  list.forEach { p ->
                      a.put(JSONObject().put("name", p.name).put("game", p.game).put("values", JSONArray(p.values)).put("date", p.date))
                  }
                  sp.edit().putString("profiles", a.toString()).apply()
              }
          }
